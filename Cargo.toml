[package]
name = "memseek-test"
version = "0.19.0"
edition = "2024"
description = "Scenario-based async load testing framework with HTTP helpers, HDR histogram latency reports and graceful shutdown"
license = "MIT"
repository = "https://github.com/mo7984130/memseek-test"
homepage = "https://github.com/mo7984130/memseek-test"
documentation = "https://docs.rs/memseek-test"
keywords = ["load-testing", "benchmark", "testing", "http", "async"]
categories = ["development-tools::testing", "asynchronous"]

[dependencies]
futures = "0.3.34"
hdrhistogram = "7.6.0"
inventory = "0.3"
reqwest = { version = "0.13.4", features = ["rustls", "json", "form", "query", "multipart"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_urlencoded = "0.7"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["signal", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"], optional = true }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "time", "macros"] }

[features]
default = []
# 终端 TUI 模式:全屏显示实时进度 + 日志滚动区(需要 tracing-subscriber 接入业务日志)
tui = ["dep:tracing-subscriber"]
